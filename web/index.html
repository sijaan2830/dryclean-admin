<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="DryClean Plus — High Performance Operations Admin Console">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="DC Admin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>DryClean Plus — Operations Admin Console</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0F172A;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    #loading-screen {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle at 50% 35%, #0F2042 0%, #070E1A 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      transition: opacity 0.35s ease-out;
    }
    .loader-box {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo-circle {
      width: 68px;
      height: 68px;
      background: #0284C7;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(2, 132, 199, 0.40);
      margin-bottom: 18px;
    }
    .logo-dc {
      color: #ffffff;
      font-weight: 900;
      font-size: 26px;
      letter-spacing: -0.5px;
    }
    .logo-plus {
      color: #38BDF8;
    }
    .hub-pill {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      margin-bottom: 26px;
    }
    .hub-dot {
      width: 8px;
      height: 8px;
      background: #22C55E;
      border-radius: 50%;
      margin-right: 8px;
      box-shadow: 0 0 10px #22C55E;
    }
    .hub-title {
      color: #E2E8F0;
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: 0.8px;
    }
    .progress-bar {
      width: 220px;
      height: 4px;
      background: rgba(255, 255, 255, 0.10);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
      margin-bottom: 14px;
    }
    .progress-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #0284C7, #38BDF8, #22C55E);
      border-radius: 4px;
      animation: loader-anim 1.4s infinite ease-in-out;
    }
    @keyframes loader-anim {
      0% { transform: translateX(-100%); }
      50% { transform: translateX(0%); }
      100% { transform: translateX(100%); }
    }
    .loading-text {
      color: #94A3B8;
      font-size: 12.5px;
      margin: 0;
      font-weight: 500;
      letter-spacing: 0.2px;
    }
  </style>
</head>
<body>
  <!-- Instant Zero-Second Preloader Shell -->
  <div id="loading-screen">
    <div class="loader-box">
      <div class="logo-circle">
        <span class="logo-dc">DC<span class="logo-plus">+</span></span>
      </div>
      <div class="hub-pill">
        <span class="hub-dot"></span>
        <span class="hub-title">ADMIN OPERATIONS CONSOLE</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill"></div>
      </div>
      <p class="loading-text">Starting Realtime Engine...</p>
    </div>
  </div>

  <script>
    // Smoothly remove preloader when Flutter engine renders
    (function() {
      var dismissed = false;
      function dismiss() {
        if (dismissed) return;
        dismissed = true;
        var el = document.getElementById('loading-screen');
        if (el) {
          el.style.opacity = '0';
          setTimeout(function() { if (el && el.parentNode) el.parentNode.removeChild(el); }, 400);
        }
      }

      window.addEventListener('flutter-first-frame', dismiss);

      var obs = new MutationObserver(function() {
        if (document.querySelector('flutter-view, flt-glass-pane')) {
          dismiss();
          obs.disconnect();
        }
      });
      obs.observe(document.body, { childList: true, subtree: true });

      // Fallback timeout in case event is missed
      setTimeout(dismiss, 9000);
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
